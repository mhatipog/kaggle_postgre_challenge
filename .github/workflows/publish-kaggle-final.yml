# Publishes only a *frozen, explicitly SHA-pinned* private release into
# the already-submitted public Kaggle fork. No admin/visibility token required.
# Configuration on this PUBLIC repository:
#   Variables: KAGGLE_PRIVATE_REPO (e.g. mhatipog/postgres-optimization-lab)
#              KAGGLE_FINAL_SHA (40-char SHA of tag competition-final-2026)
#   Secret:    KAGGLE_PRIVATE_READ_TOKEN (fine-grained PAT, Contents: read,
#              selected PRIVATE source repository only)
# The private repo must preserve this public fork's Git ancestry, including
# this workflow commit, so the final promotion is fast-forward-only.
# Check the successful run and update the submitted Kaggle Writeup manually.
name: Publish frozen Kaggle final

on:
  workflow_dispatch:
  schedule:
    # 9 Nov 2026, 18:17 Europe/Brussels = 17:17 UTC.
    # More than 33 hours ahead of 11 Nov 2026 03:59 CET deadline.
    - cron: '17 17 9 11 *'

permissions:
  contents: write

concurrency:
  group: kaggle-final-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mhatipog/kaggle_postgre_challenge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check frozen-release configuration
        shell: bash
        env:
          PRIVATE_REPO: ${{ vars.KAGGLE_PRIVATE_REPO }}
          FINAL_SHA: ${{ vars.KAGGLE_FINAL_SHA }}
          PRIVATE_READ_TOKEN: ${{ secrets.KAGGLE_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_REPO" =~ ^mhatipog/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::Set KAGGLE_PRIVATE_REPO to the private standalone repository"; exit 1;
          }
          [[ "$FINAL_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || {
            echo "::error::Set KAGGLE_FINAL_SHA to the vetted 40-character final Git SHA"; exit 1;
          }
          [[ -n "$PRIVATE_READ_TOKEN" ]] || {
            echo "::error::Set KAGGLE_PRIVATE_READ_TOKEN secret with private Contents read access"; exit 1;
          }
      - name: Checkout public submission fork
        uses: actions/checkout@v4
        with:
          path: public
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout frozen private release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.KAGGLE_PRIVATE_REPO }}
          token: ${{ secrets.KAGGLE_PRIVATE_READ_TOKEN }}
          ref: competition-final-2026
          path: private-candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact pinned release and fast-forward public fork
        shell: bash
        working-directory: public
        env:
          FINAL_SHA: ${{ vars.KAGGLE_FINAL_SHA }}
        run: |
          set -euo pipefail
          actual="$(git -C ../private-candidate rev-parse HEAD)"
          if [[ "$actual" != "$FINAL_SHA" ]]; then
            echo "::error::Frozen tag SHA differs from vetted KAGGLE_FINAL_SHA"
            exit 1
          fi
          git fetch --no-tags ../private-candidate "$actual"
          [[ "$(git rev-parse FETCH_HEAD)" == "$FINAL_SHA" ]] || exit 1
          git merge-base --is-ancestor HEAD FETCH_HEAD || {
            echo "::error::Private release is not a fast-forward of public main; do not force push."
            exit 1
          }
          git merge --ff-only FETCH_HEAD
          git push origin HEAD:main
          echo "### Final source published" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned commit: \`$FINAL_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Public: https://github.com/mhatipog/kaggle_postgre_challenge/commit/$FINAL_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "**Manual step required:** update and re-submit Kaggle Writeup with this exact SHA before the deadline." >> "$GITHUB_STEP_SUMMARY"
