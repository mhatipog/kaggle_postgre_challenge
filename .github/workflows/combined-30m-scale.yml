name: Combined PK and manifest 30m scale gate

on:
  pull_request:
    paths:
      - '.github/workflows/combined-30m-scale.yml'
      - 'benchmarks/headless_e2e.py'
      - 'services/postgres_service.py'
      - 'benchmarks/assert_schema_invariants.py'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BENCH_ROWS: '30000000'
      PDM_BENCH_PG_USER: kaggle_ci
      PDM_BENCH_SSH_USER: kagglebench
      PDM_EXPANSION_WORKERS: '2'
      # Deliberately no optimization environment variables: test release defaults.
    steps:
      - name: Checkout our candidate
        uses: actions/checkout@v4
        with:
          path: ours
          persist-credentials: false
      - name: Checkout pinned competitor
        uses: actions/checkout@v4
        with:
          repository: bcap52/kaggle_postgre_challenge
          ref: 7b81ca2797f06304d81477afcb0cfb3dad75ff43
          path: competitor
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies PostgreSQL and localhost SSH daemon
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r ours/requirements.txt
          sudo systemctl start postgresql
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          sudo mkdir -p /run/sshd
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          sudo useradd -m -s /bin/bash kagglebench
          printf '%s:%s\n' kagglebench "$password" | sudo chpasswd
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE kaggle_ci WITH LOGIN CREATEDB PASSWORD '$password';"
          sudo /usr/sbin/sshd -p 2222 -o PasswordAuthentication=yes -o UsePAM=no
          echo "PDM_BENCH_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$password" >> "$GITHUB_ENV"
          echo "PG_KAGGLE_CHALLENGE_PASS=$password" >> "$GITHUB_ENV"
          pg_isready -h localhost -p 5432
      - name: Generate official unchanged data
        working-directory: ours
        run: |
          python generate_database.py --rows "$BENCH_ROWS" --host 127.0.0.1 --postgres_port 5432 --user kaggle_ci --admin_database postgres
      - name: Confirm runner headroom after official generation
        shell: bash
        run: |
          df -h /
          free -h
          test "$(df -PB1 / | awk 'NR==2 {print $4}')" -ge 12884901888 || exit 1
      - name: Snapshot original FK, unique and index definitions
        working-directory: ours
        run: python benchmarks/assert_schema_invariants.py --file ../benchmark_comparison/schema_before.json
      - name: Combined manifest and PK-rebuild candidate first (cold cache)
        working-directory: ours
        env:
          PDM_EXPANSION_REBUILD_PRIMARY_KEYS: '1'
          PDM_EXPANSION_MANIFEST_FROM_STAGE: '1'
        run: python benchmarks/headless_e2e.py --label our_candidate --out-dir ../benchmark_comparison
      - name: Confirm candidate left original FK and index definitions unchanged
        working-directory: ours
        run: python benchmarks/assert_schema_invariants.py --file ../benchmark_comparison/schema_before.json --verify
      - name: Verify dependency manifest matches unmodified raw source
        working-directory: ours
        run: |
          python - <<'PY'
          import os,subprocess
          sql = """
          WITH original AS (
            SELECT raw_schema::text AS raw_schema, raw_hash::text AS raw_hash,
                   count(*)::bigint AS row_count
            FROM public.raw_data WHERE raw_schema IN ('group001')
            GROUP BY raw_schema, raw_hash
          ), expected AS (
            SELECT COALESCE(jsonb_agg(jsonb_build_object(
                   'raw_schema',raw_schema,'raw_hash',raw_hash,
                   'row_count',row_count) ORDER BY raw_schema,raw_hash NULLS FIRST),
                   '[]'::jsonb) AS hashes,
                   sum(row_count) AS num,
                   count(DISTINCT raw_hash) AS hashes_count
            FROM original
          ), actual AS (
            SELECT source_manifest AS payload
            FROM pgdm_runtime.expansion_commits
            ORDER BY committed_at DESC LIMIT 1
          )
          SELECT CASE WHEN
            actual.payload -> 'raw_hash_manifest' = expected.hashes
            AND (actual.payload ->> 'expected_row_count')::bigint = expected.num
            AND (actual.payload ->> 'expected_distinct_raw_hash_count')::bigint = expected.hashes_count
            THEN 'PASS' ELSE 'FAIL' END
          FROM expected CROSS JOIN actual;
          """
          r=subprocess.run(['psql','-h','127.0.0.1','-U',
                            os.environ['PDM_BENCH_PG_USER'],'-d',
                            'kaggle_challenge','-X','-qAt','-v','ON_ERROR_STOP=1'],
                            input=sql,text=True,capture_output=True,check=True)
          assert r.stdout.strip()=='PASS', 'Dependency manifest mismatch: '+r.stdout+r.stderr
          print('PASS: source dependency manifest unchanged')
          PY
      - name: Reset to empty tables for release-default reference
        working-directory: competitor
        run: python benchmarks/reset_challenge.py
      - name: Release-default PK-maintained reference second (warm cache)
        working-directory: ours
        env:
          PDM_EXPANSION_REBUILD_PRIMARY_KEYS: '0'
          PDM_EXPANSION_MANIFEST_FROM_STAGE: '0'
        run: python benchmarks/headless_e2e.py --label release_default --out-dir ../benchmark_comparison
      - name: Assert official fast path is active without environment switches
        working-directory: ours
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          record=json.loads(Path('../benchmark_comparison/our_candidate.json').read_text())
          stages=[x['name'] for x in record.get('items',[])]
          assert any('Single-pass shared JSONB source projection' in x for x in stages), 'Release default silently fell back to legacy path'
          print('PASS: single-pass release optimization active by default')
          PY
      - name: Confirm all FK constraints and indexes restored after COMMIT
        working-directory: ours
        run: python benchmarks/assert_schema_invariants.py --file ../benchmark_comparison/schema_before.json --verify
      - name: Verify 30M row-level equivalence and benchmark speed
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("benchmark_comparison")
          combined=json.loads((p/"our_candidate.json").read_text())
          release=json.loads((p/"release_default.json").read_text())
          assert combined["signatures"]==release["signatures"], "30M output fingerprint mismatch"
          assert {k:v["rows"] for k,v in combined["signatures"].items()} == {k:v["rows"] for k,v in release["signatures"].items()}, "30M destination row counts differ"
          ours=combined["measured_processing_total"]
          ref=release["measured_processing_total"]
          assert ours>0 and ref>0
          summary={"rows":int(os.environ["BENCH_ROWS"]),"combined_s":ours,"release_s":ref,
                   "improvement_pct":round(100*(ref-ours)/ref,2),
                   "parity":"six destination fingerprints and row counts identical",
                   "recovery":"already tested at 10M; not repeated on 30M"}
          (p/"summary_30m.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## 30M official dataset scaling\n\n")
              f.write(f"Combined: {ours:.3f}s; release: {ref:.3f}s; improvement: {summary['improvement_pct']}%\n\n")
              f.write("Six-table fingerprint and row-count parity: PASS\n")
          PY
      - name: Upload all benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-30m-scale
          path: benchmark_comparison/
          if-no-files-found: ignore
          retention-days: 30
