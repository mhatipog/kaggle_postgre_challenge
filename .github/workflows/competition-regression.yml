name: Competition SQL regression checks
on:
  push:
    branches:
      - competition/jsonb-record-optimization
  pull_request:
    branches:
      - main
      - competition/jsonb-record-optimization
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check modified application syntax
        run: python -m py_compile services/postgres_service.py
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
