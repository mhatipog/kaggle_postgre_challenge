name: Windows DB Manager smoke tests
on:
  pull_request:
    branches: [main, competition/jsonb-record-optimization]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Windows GUI and database service
        run: python -m py_compile main.py services/postgres_service.py
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests -v
